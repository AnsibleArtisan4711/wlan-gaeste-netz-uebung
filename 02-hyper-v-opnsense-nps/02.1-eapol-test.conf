# Konfiguration fuer eapol_test (Teil von wpa_supplicant), Uebung 02.1.
# Simuliert den Client; eapol_test selbst spielt den Access Point gegenueber dem NPS.
# Aufruf:  eapol_test -c 02.1-eapol-test.conf -a 192.168.10.10 -p 1812 -s <RADIUS-Geheimnis> -A 192.168.10.20 -N 61:d:19
# Das Geheimnis kommt per Parameter -s, nie in diese Datei.
network={
    key_mgmt=WPA-EAP
    eap=PEAP
    identity="wlan.test"
    password="HIER-DAS-KENNWORT-DES-TESTKONTOS"
    phase2="auth=MSCHAPV2"
    # Das Zertifikat des NPS ist selbstsigniert. In der Uebung wird es nicht geprueft (ca_cert fehlt bewusst).
    # In einem echten Netz IMMER ca_cert setzen, sonst kann ein falscher Access Point die Anmeldedaten abgreifen.
}
